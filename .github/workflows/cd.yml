
# TP02 - Continuous Delivery
# Runs after CI has completed successfully on a push to main.
name: CD DevOps

on:
  workflow_run:
    workflows:
      - CI DevOps
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    name: Build and publish Docker images
    runs-on: ubuntu-24.04

    # Only publish after a successful CI push on main.
    # Exclude pull request runs even if their source branch is main.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main' }}

    steps:
      # Build the exact commit that passed the CI workflow.
      # workflow_run would otherwise check out the default branch HEAD.
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Log in using encrypted GitHub repository secrets.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Publish the Java backend image.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: true
          tags: nifdgg/tp-devops-simple-api:latest

      # Publish the PostgreSQL image.
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: nifdgg/tp-devops-database:latest

      # Publish the Apache HTTP Server image.
      - name: Build and push HTTP server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: true
          tags: nifdgg/tp-devops-http-server:latest
