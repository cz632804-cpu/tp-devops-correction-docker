
# TP02 - GitHub Actions: Continuous Integration and Delivery
name: CI CD DevOps

# Run CI on main/develop and pull requests.
# Docker images are published only for pushes to main.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job 1: Compile and test the Spring Boot application.
  test-backend:
    name: Build and test backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # The Docker TP uses Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      - name: Build and test with Maven
        working-directory: simple-api
        run: mvn -B clean verify

  # Job 2: Build images only when the Maven tests pass.
  build-and-push-docker-image:
    name: Build and publish Docker images
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Authenticate without exposing the Docker Hub token in source code.
      # Pull requests and develop builds do not publish images.
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Spring Boot backend image.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-simple-api:latest

      # Build the PostgreSQL image.
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-database:latest

      # Build the Apache HTTP Server image.
      - name: Build and push HTTP server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-http-server:latest
