
# TP02 - GitHub Actions CI/CD with SonarQube Cloud
name: CI CD DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # CI: compile, test and analyze the Java application.
  test-backend:
    name: Build test and analyze backend
    runs-on: ubuntu-24.04

    steps:
      # Full Git history improves SonarQube analysis.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The project uses Java 21 and Maven.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      - name: Build and test with Maven
        working-directory: simple-api
        run: mvn -B clean verify

      # Analyze source code using the token stored in GitHub Secrets.
      # The Quality Gate determines whether the analysis passes.
      - name: SonarQube Cloud analysis and Quality Gate
        working-directory: simple-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=cz632804-cpu_tp-devops-correction-docker \
            -Dsonar.organization=cz632804-cpu \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

  # CD runs only after successful tests and Quality Gate.
  build-and-push-docker-image:
    name: Build and publish Docker images
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Secrets are only used when publishing on main.
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-simple-api:latest

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-database:latest

      - name: Build and push HTTP server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-http-server:latest
