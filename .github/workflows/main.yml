
# TP02 - GitHub Actions: CI, CD and SonarQube Cloud
name: CI CD DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # First job: build, test and analyze the Java backend.
  test-backend:
    name: Build test and analyze backend
    runs-on: ubuntu-24.04

    steps:
      # SonarQube needs the full Git history for accurate analysis.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      # Run unit and integration tests before analysis.
      - name: Build and test with Maven
        working-directory: simple-api
        run: mvn -B clean verify

      # Invoke the SonarQube Maven plugin by its full coordinates.
      # This avoids "No plugin found for prefix 'sonar'".
      # The token is stored securely in GitHub Actions secrets.
      - name: SonarQube Cloud analysis and Quality Gate
        working-directory: simple-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=cz632804-cpu_tp-devops-correction-docker \
            -Dsonar.organization=cz632804-cpu \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

  # Second job: Docker images are built only if CI succeeds.
  build-and-push-docker-image:
    name: Build and publish Docker images
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Docker Hub credentials are only used for main pushes.
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-simple-api:latest

      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-database:latest

      - name: Build and push HTTP server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: nifdgg/tp-devops-http-server:latest
