
# TP02 - Continuous Integration
# CI runs on main and develop.
# SonarQube Cloud analysis runs only on main due to Free plan limitations.
name: CI DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-backend:
    name: Build test and analyze backend
    runs-on: ubuntu-24.04

    steps:
      # Download the complete repository history for SonarQube.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure the Java version used by the backend.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: simple-api/pom.xml

      # Always compile and execute unit/integration tests.
      # This step runs on main, develop and pull requests.
      - name: Build and test with Maven
        working-directory: simple-api
        run: mvn -B clean verify

      # The current SonarQube Cloud organization cannot access
      # non-main branch analysis data on its Free plan.
      # Keep the strict Quality Gate for main branch pushes.
      - name: SonarQube Cloud analysis and Quality Gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: simple-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=cz632804-cpu_tp-devops-correction-docker \
            -Dsonar.organization=cz632804-cpu \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true
